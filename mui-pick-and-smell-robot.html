    return Math.abs(hit[0])&lt;=table.x &amp;&amp; Math.abs(hit[2])&lt;=table.z ? hit : null;
  }

  function fits(name,p,layout=positions) {
    const radius = samples[name].radius;
    if (Math.abs(p[0])&gt;table.x-radius || Math.abs(p[2])&gt;table.z-radius) return false;
    if (Math.hypot(p[0]-base[0],p[2]-base[2])&lt;.65+radius+.12) return false;
    return Object.entries(layout).every(([other,q])=&gt;other===name ||
      Math.hypot(p[0]-q[0],p[2]-q[2])&gt;=radius+samples[other].radius+.14);
  }

  function placeAt(point,finish,preview=false) {
    const sample = sampleAt(placementObject);
    if (!point) {
      placementNotice=&#x27;Choose a spot on the tabletop.&#x27;;
    } else {
      const x = table.x-sample.radius, z = table.z-sample.radius;
      const p = [clamp(point[0],-x,x),sample.position[1],clamp(point[2],-z,z)];
      if (fits(placementObject,p)) {
        positions[placementObject]=p;
        mission=planMission();
        placementNotice=&#x27;&#x27;;
        if (finish) setPlacement(false);
        else render();
        if (!preview) save();
        return;
      }
      placementNotice=&#x27;That spot is occupied. Try a clear part of the table.&#x27;;
    }
    render();
  }

  function clipNear(points) {
    const depth = p=&gt;dot(sub(p,basis.eye),basis.forward);
    const clipped = [];
    let previous = points.at(-1);
    let previousDepth = depth(previous);
    for (const point of points) {
      const nextDepth = depth(point);
      if ((previousDepth&gt;=.055)!==(nextDepth&gt;=.055)) {
        clipped.push(lerp(previous,point,(.055-previousDepth)/(nextDepth-previousDepth)));
      }
      if (nextDepth&gt;=.055) clipped.push(point);
      previous=point;
      previousDepth=nextDepth;
    }
    return clipped;
  }

  function path(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0],points[0][1]);
    points.slice(1).forEach(p=&gt;ctx.lineTo(p[0],p[1]));
  }

  function surface(points, center, material) {
    const normal = unit(cross(sub(points[1],points[0]),sub(points[2],points[0])));
    const outward = dot(normal,sub(points[0],center)) &lt; 0 ? mul(normal,-1) : normal;
    if (dot(outward,sub(basis.eye,points[0])) &lt;= 0) return;
    const screen = clipNear(points).map(project);
    if (screen.length&lt;3) return;
    const shade = .09 + .20*dot(outward,light);
    const shaded = shade &lt; 0 ? mix(material,palette.slot,-shade) : mix(material,palette.light,shade);
    faces.push({screen, fill:color(shaded), z:screen.reduce((s,p)=&gt;s+p[2],0)/screen.length});
  }

  function drawFaces() {
    faces.sort((a,b)=&gt;b.z-a.z);
    for (const face of faces) {
      path(face.screen);
      ctx.closePath();
      ctx.fillStyle = ctx.strokeStyle = face.fill;
      ctx.lineWidth = .65;
      ctx.fill();
      ctx.stroke();
    }
    faces = [];
  }

  function box(center,size,material,angle=0) {
    const [x,y,z] = size.map(v=&gt;v/2);
    const c=Math.cos(angle), s=Math.sin(angle);
    const corners = [[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]]
      .map(([a,b,d])=&gt;add(center,[a*c+d*s,b,d*c-a*s]));
    for (const face of [[0,1,2,3],[4,5,6,7],[0,4,7,3],[1,5,6,2],[0,1,5,4],[3,2,6,7]]) {
      surface(face.map(i=&gt;corners[i]),center,material);
    }
  }

  function ring(center,a,b,r,n) {
    return Array.from({length:n},(_,i)=&gt;{
      const angle=2*Math.PI*i/n;
      return add(center,add(mul(a,r*Math.cos(angle)),mul(b,r*Math.sin(angle))));
    });
  }

  function tube(start,end,r1,r2,material,n=18,caps=true) {
    const center = lerp(start,end,.5);
    const axis = unit(sub(end,start));
    const a = unit(cross(axis,Math.abs(axis[1])&gt;.94?[1,0,0]:up));
    const b = cross(axis,a);
    const low = ring(start,a,b,r1,n), high = ring(end,a,b,r2,n);
    for (let i=0;i&lt;n;i++) {
      const j=(i+1)%n;
      surface([low[i],low[j],high[j],high[i]],center,material);
    }
    if (caps) {
      surface(low,center,material);
      surface(high,center,material);
    }
  }

  function sphere(center,r,material) {
    const n=18, bands=10;
    const rows = Array.from({length:bands+1},(_,i)=&gt;{
      const a = i*Math.PI/bands;
      return ring(add(center,[0,Math.cos(a)*r,0]),[1,0,0],[0,0,1],Math.max(.0001,Math.sin(a))*r,n);
    });
    for (let i=0;i&lt;bands;i++) for (let j=0;j&lt;n;j++) {
      const k=(j+1)%n;
      surface([rows[i][j],rows[i][k],rows[i+1][k],rows[i+1][j]],center,material);
    }
  }

  function line(a,b,stroke,weight=1) {
    const da=dot(sub(a,basis.eye),basis.forward);
    const db=dot(sub(b,basis.eye),basis.forward);
    if (Math.max(da,db)&lt;.055) return;
    const points=[project(da&lt;.055?lerp(a,b,(.055-da)/(db-da)):a),
      project(db&lt;.055?lerp(b,a,(.055-db)/(da-db)):b)];
    path(points);
    ctx.strokeStyle=stroke;
    ctx.lineWidth=weight;
    ctx.stroke();
  }

  function circle(center,r,stroke,weight=1) {
    const points=ring(center,[1,0,0],[0,0,1],r,42).map(project);
    if (points.some(p=&gt;!p)) return;
    path(points);
    ctx.closePath();
    ctx.strokeStyle=stroke;
    ctx.lineWidth=weight;
    ctx.stroke();
  }

  function canReach(tip) {
    return norm(sub(add(tip,[0,.64,0]),shoulder))&lt;=upper+lower-.025;
  }

  function scanFrom(tip) {
    const {cameraEye,cameraAim} = wristGeometry(tip);
    const {eye,forward,right,vertical} = cameraBasis(cameraEye,cameraAim);
    const detections = [];
    for (const name of Object.keys(positions)) {
      const delta = sub(positions[name],eye);
      const depth = dot(delta,forward);
      if (depth&lt;=0) continue;
      const x = dot(delta,right)/depth, y = dot(delta,vertical)/depth;
      if (Math.abs(x)&gt;.49 || Math.abs(y)&gt;.49) continue;
      detections.push({name,offCenter:Math.hypot(x,y)});
    }
    return detections.sort((a,b)=&gt;a.offCenter-b.offCenter).map(detection=&gt;detection.name);
  }

  function planMission() {
    const keys = [[0,rest],[.35,rest]];
    const steps = [restStep,searchStep];
    const observations = [];
    const requested = requestedTarget();
    const pickupIsReachable = name=&gt;{
      const [x,,z]=positions[name];
      return canReach([x,2.05,z]);
    };
    const columns = [-3.05,-1.65,-.25,1.15,2.55];
    const rows = [-1.65,-.35,.95,1.85];
    let clock=.35, target=null;
    scan:
    for (const [row,z] of rows.entries()) {
      for (const x of row%2===0?columns:[...columns].reverse()) {
        const high=[x,2.05,z];
        const point=canReach(high)?high:[x,1.65,z];
        if (!canReach(point)) continue;
        clock+=.68;
        keys.push([clock,point]);
        const seen=scanFrom(point);
        target=seen.find(name=&gt;(!requested || name===requested) &amp;&amp; pickupIsReachable(name)) ?? null;
        const frameTime=clock;
        clock+=.42;
        keys.push([clock,point]);
        observations.push({at:frameTime,until:clock,seen,target,number:observations.length+1});
        if (target) break scan;
      }
    }
    const foundAt=clock;
    if (!target) {
      keys.push([clock+1.45,rest]);
      steps.push([&#x27;Return&#x27;,clock,&#x27;Search complete · Returning to the rest pose.&#x27;],
        [&#x27;No pickup&#x27;,clock+1.45,requested
          ? &#x27;The sweep found no reachable &#x27;+samples[requested].name+&#x27;.&#x27;
          : &#x27;The camera found no reachable object during the sweep.&#x27;]);
      return {keys,steps,observations,target,foundAt,duration:clock+1.95};
    }

    const p=positions[target];
    const scan=[p[0],2.05,p[2]], hover=[p[0],1.58,p[2]];
    const gripAt=clock+2.70, liftAt=gripAt+1, sampleAt=liftAt+2.35;
    const returnAt=sampleAt+2.40, releaseAt=returnAt+1.85;
    const reportAt=releaseAt+2.65, duration=reportAt+.50;
    keys.push([clock+1.05,scan],[clock+1.80,hover],[gripAt,p],[liftAt,p],
      [sampleAt,hover],[returnAt,hover],[releaseAt,p],[releaseAt+.45,p],
      [releaseAt+1.20,scan],[reportAt,rest],[duration,rest]);
    steps.push(
      [&#x27;Found&#x27;,clock,&#x27;Simulated vision · Found the {target}. Planning the pickup.&#x27;],
      [&#x27;Approach&#x27;,clock+1.05,&#x27;Motion controller · Moves the open jaws around the {target}.&#x27;],
      [&#x27;Grip&#x27;,gripAt,&#x27;Gripper · Closes around the {target}.&#x27;],
      [&#x27;Lift&#x27;,liftAt,&#x27;Motion controller · Lifts the {target} into the air.&#x27;],
      [&#x27;Sample&#x27;,sampleAt,&#x27;MUI e-nose · The wrist inlet draws air near the held object through the tube.&#x27;],
      [&#x27;Return&#x27;,returnAt,&#x27;Motion controller · Returns the {target} to the table and parks the arm.&#x27;],
      [&#x27;Report&#x27;,reportAt,&#x27;Simulated result · {result}.&#x27;]
    );
    return {keys,steps,observations,target,foundAt,gripAt,liftAt,sampleAt,returnAt,releaseAt,duration};
  }

  function moveToOrFromRest(start,finish,t) {
    const a = sub(start,base), b = sub(finish,base);
    const heading = Math.atan2(a[2],a[0]);
    const turn = Math.atan2(b[2],b[0])-heading;
    const angle = heading+Math.atan2(Math.sin(turn),Math.cos(turn))*t;
    const r = Math.hypot(a[0],a[2])*(1-t)+Math.hypot(b[0],b[2])*t;
    return add(base,[r*Math.cos(angle),a[1]+(b[1]-a[1])*t,r*Math.sin(angle)]);
  }

  function pose() {
    const {keys,target,foundAt,gripAt,liftAt,releaseAt}=mission;
    const end = keys.findIndex(([t])=&gt;t&gt;time);
    let tip = keys.at(-1)[1];
    if (end&gt;0) {
      const [a,start]=keys[end-1], [b,finish]=keys[end];
      const progress=(time-a)/(b-a);
      const t=progress*progress*(3-2*progress);
      const sweeping = a&lt;=foundAt || start===rest || finish===rest;
      tip=sweeping &amp;&amp; start!==finish ? moveToOrFromRest(start,finish,t) : lerp(start,finish,t);
    }
    const held = Boolean(target) &amp;&amp; time&gt;=liftAt &amp;&amp; time&lt;releaseAt;
    const grip = target ? clamp(Math.min(time-gripAt,(releaseAt+.45-time)/.45),0,1) : 0;
    return {...wristGeometry(tip),tip,held,grip};
  }

  function wristGeometry(tip) {
    const yawAngle = Math.atan2(tip[2]-base[2],tip[0]-base[0]);
    const across=[-Math.sin(yawAngle),0,Math.cos(yawAngle)];
    const along=[Math.cos(yawAngle),0,Math.sin(yawAngle)];
    const wrist=add(tip,[0,.64,0]);
    const cameraEye=add(add(tip,[0,.56,0]),mul(across,-.35));
    const cameraAim=add(cameraEye,add([0,-1.25,0],mul(across,.31)));
    const probeMount = add(add(tip,[0,.58,0]),add(mul(along,.38),mul(across,.20)));
    const inlet = add(add(tip,[0,.46,0]),add(mul(along,.30),mul(across,.12)));
    return {wrist,cameraEye,cameraAim,along,across,probeMount,inlet};
  }

  function robot(state,sample) {
    const {tip,wrist,cameraEye,grip,along,across} = state;
    if (!wristView) {
      const at = y=&gt;[base[0],y,base[2]];
      tube(at(.006),at(.13),.65,.65,palette.foot,32);
      tube(at(.13),at(.35),.49,.49,palette.joint,28);
      tube(at(.35),at(.54),.49,.36,palette.shell,28);
      tube(at(.54),at(.88),.31,.31,palette.shell);
      const direction = unit(sub(wrist,shoulder));
      const normal = unit(cross(across,direction));
      const length = norm(sub(wrist,shoulder));
      const advance=(upper*upper-lower*lower+length*length)/(2*length);
      const elbow=add(add(shoulder,mul(direction,advance)),mul(normal,Math.sqrt(Math.max(0,upper*upper-advance*advance))));
      const link = (a,b,r) =&gt; {
        tube(a,b,r,r*.81,palette.shell);
        const strip = mul(across,r*.80);
        tube(add(lerp(a,b,.18),strip),add(lerp(a,b,.82),strip),.055,.055,palette.metal,10);
      };
      link(shoulder,elbow,.23);
      link(elbow,wrist,.19);
      for (const [point,r,span] of [[shoulder,.35,.29],[elbow,.29,.24],[wrist,.205,.17]]) {
        tube(add(point,mul(across,-span)),add(point,mul(across,span)),r,r,palette.joint,24);
        for (const sign of [-1,1]) {
          tube(add(point,mul(across,sign*span)),add(point,mul(across,sign*(span+.05))),r*.73,r*.72,palette.metal);
          tube(add(point,mul(across,sign*(span+.05))),add(point,mul(across,sign*(span+.059))),r*.34,r*.34,palette.slot);
        }
      }
      const hose = [
        at(.43), add(shoulder,mul(across,.31)),
        add(lerp(shoulder,elbow,.18),mul(across,.23)),
        add(lerp(shoulder,elbow,.82),mul(across,.22)),
        add(elbow,mul(across,.27)),
        add(lerp(elbow,wrist,.25),mul(across,.21)),
        add(lerp(elbow,wrist,.80),mul(across,.20)),
        add(wrist,mul(across,.20)), state.probeMount
      ];
      for (let i=1;i&lt;hose.length;i++) tube(hose[i-1],hose[i],.035,.035,palette.signal,10);
      const panel=add(at(.27),[0,0,.465]);
      box(panel,[.52,.19,.10],palette.nose);
      box(add(panel,[.14,.01,.051]),[.055,.05,.01],palette.signal);
      const rotation = Math.atan2(-along[2],along[0]);
      box(add(tip,[0,.43,0]),[.40,.22,1.01],palette.foot,rotation);
      box(add(cameraEye,[0,.075,0]),[.27,.18,.27],palette.accent,rotation);
      const lens = add(cameraEye,mul(unit(sub(state.cameraAim,cameraEye)),.085));
      tube(add(cameraEye,[0,.045,0]),lens,.095,.08,palette.slot,18);
      tube(cameraEye,lerp(cameraEye,lens,1.1),.052,.052,palette.accent,18);
    }
    tube(state.probeMount,state.inlet,.075,.056,palette.nose,18);
    const mouth = add(state.inlet,mul(unit(sub(state.inlet,state.probeMount)),.007));
    tube(state.inlet,mouth,.034,.034,palette.slot,18);
    const rotation=Math.atan2(-along[2],along[0]);
    const gap=sample.radius+.04+(1-grip)*.15;
    for (const sign of [-1,1]) {
      const pad=add(tip,mul(across,sign*gap));
      box(add(pad,[0,.22,0]),[.14,.31,.083],palette.metal,rotation);
      box(add(pad,[0,.062,0]),[.16,.105,.091],palette.foot,rotation);
    }
  }

  function object(name,center) {
    if (name===&#x27;orange&#x27;) {
      sphere(center,.28,palette.orange);
      tube(add(center,[0,.265,0]),add(center,[.025,.32,0]),.044,.026,palette.nose,10);
    } else if (name===&#x27;block&#x27;) {
      box(center,[.52,.46,.52],palette.block);
      box(add(center,[0,.232,0]),[.30,.006,.075],palette.inset);
    } else {
      const foot=add(center,[0,-.36,0]), lip=add(center,[0,.37,0]);
      tube(foot,lip,.205,.28,palette.cup,22);
      tube(add(lip,[0,.002,0]),add(lip,[0,.008,0]),.236,.236,palette.slot,22);
      tube(add(lip,[0,.008,0]),add(lip,[0,.011,0]),.185,.185,mix(palette.cup,palette.slot,.60),22);
      tube(add(center,[0,-.23,0]),add(center,[0,-.15,0]),.222,.232,palette.metal,22,false);
    }
  }

  function label(point,text,material,side,dy) {
    const p=project(point);
    if (!p || p[0]&lt;0 || p[0]&gt;width || p[1]&lt;0 || p[1]&gt;height) return;
    ctx.font=&#x27;500 12px system-ui&#x27;;
    const w=ctx.measureText(text).width+18;
    const x=clamp(p[0]+(side&gt;0?22:-w-22),6,width-w-6);
    const y=clamp(p[1]+dy,30,height-14);
    ctx.strokeStyle=color(material);
    ctx.fillStyle=color(material);
    ctx.lineWidth=1.1;
    path([p,[x+(side&gt;0?0:w),y]]);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p[0],p[1],2.8,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=color(palette.bg);
    ctx.beginPath();
    ctx.roundRect(x,y-11,w,22,5);
    ctx.fill();
    ctx.fillStyle=color(palette.fg);
    ctx.textBaseline=&#x27;middle&#x27;;
    ctx.fillText(text,x+9,y);
  }

  function latestObservation() {
    return mission.observations.findLast(frame=&gt;frame.at&lt;=time);
  }

  function drawDetection(position,radius,isTarget) {
    const p=project(position);
    if (!p || p[0]&lt;20 || p[0]&gt;width-20 || p[1]&lt;30 || p[1]&gt;height-20) return;
    const r=clamp(focal*radius/p[2]*1.42,21,72);
    ctx.strokeStyle=color(isTarget?palette.accent:palette.orange);
    ctx.lineWidth=2;
    for (const x of [-1,1]) for (const y of [-1,1]) {
      path([[p[0]+x*(r-10),p[1]+y*r],[p[0]+x*r,p[1]+y*r],[p[0]+x*r,p[1]+y*(r-10)]]);
      ctx.stroke();
    }
  }

  function draw() {
    if (!width || !height) return;
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.clearRect(0,0,width,height);
    const detected = mission.target &amp;&amp; time&gt;=mission.foundAt;
    const sample = sampleAt(placementObject ?? (detected?mission.target:requestedTarget()) ?? &#x27;cup&#x27;);
    const state=pose();
    focal=Math.min(width*1.24,height*1.55)*zoom;
    offsetY=height*.49;
    if (wristView) {
      view(state.cameraEye,state.cameraAim);
      focal=Math.min(width,height)*.67;
    } else {
      const focus=[-.04,1.04,.15];
      const distance=width&lt;450?11.9:11.2;
      view(add(focus,[Math.sin(yaw)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw)*Math.cos(pitch)*distance]),focus);
    }

    box([0,-.14,0],[7.35,.28,4.70],palette.bench);
    drawFaces();
    for (let x=-3.5;x&lt;=3.5;x+=.5) line([x,.005,-2.34],[x,.005,2.34],color(palette.grid),.55);
    for (let z=-2;z&lt;=2;z+=.5) line([-3.67,.005,z],[3.67,.005,z],color(palette.grid),.55);
    if (!state.held &amp;&amp; (placing || detected)) {
      circle([sample.position[0],.015,sample.position[2]],sample.radius+.22,color(palette.accent),1.5);
    }
    for (const [name,position] of Object.entries(positions)) {
      object(name,name===mission.target &amp;&amp; state.held?state.tip:position);
    }
    robot(state,sample);
    drawFaces();

    if (state.held &amp;&amp; time&gt;=mission.sampleAt &amp;&amp; time&lt;mission.returnAt) {
      const progress=(time-mission.sampleAt)/(mission.returnAt-mission.sampleAt);
      for (let i=0;i&lt;3;i++) {
        const f=(progress*1.8+i*.29)%1;
        const air=add(state.tip,[0,.35+i*.025,0]);
        line(lerp(air,state.inlet,f),lerp(air,state.inlet,Math.min(1,f+.17)),color(palette.signal),2);
      }
    }
    if (wristView) {
      const observation=latestObservation();
      if (observation &amp;&amp; time&lt;observation.until) {
        for (const name of observation.seen) {
          drawDetection(positions[name],samples[name].radius,name===observation.target);
        }
      } else if (detected &amp;&amp; time&lt;mission.releaseAt+.45) {
        drawDetection(state.held?state.tip:sample.position,sample.radius,true);
      }
    } else {
      label(state.cameraEye,&#x27;Wrist camera&#x27;,palette.accent,-1,-25);
      label(state.inlet,&#x27;MUI tube inlet&#x27;,palette.signal,1,-24);
      if (width&gt;=500) {
        label(add(base,[0,.30,.50]),&#x27;MUI sensor chamber&#x27;,palette.signal,-1,24);
        label(add(state.tip,[0,.075,0]),&#x27;Gripper&#x27;,palette.metal,1,22);
      }
    }
    ctx.fillStyle=color(palette.fg);
    ctx.font=&#x27;12px system-ui&#x27;;
    ctx.textBaseline=&#x27;top&#x27;;
    ctx.fillText(wristView?&#x27;Simulated wrist-camera view&#x27;:placing?&#x27;Click or tap the tabletop&#x27;:&#x27;Drag an object to move it · Drag the scene to orbit&#x27;,10,10);
  }

  function resize() {
    const rect=canvas.getBoundingClientRect();
    width=rect.width;
    height=rect.height;
    ratio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(width*ratio);
    canvas.height=Math.round(height*ratio);
    palette=colors();
    draw();
  }

  function renderModels(stage) {
    const frame=latestObservation();
    let vision=&#x27;Waiting for the wrist camera.&#x27;;
    const requested=requestedTarget();
    const requestedName=requested?samples[requested].name:null;
    let planner=requestedName
      ? &#x27;Goal · Find the &#x27;+requestedName+&#x27; and sample its odor.&#x27;
      : &#x27;Goal · Find a reachable object and sample its odor.&#x27;;
    if (placing) {
      vision=&#x27;Paused while you place the object.&#x27;;
      planner=&#x27;Ready to search the new layout.&#x27;;
    } else if (frame) {
      const names=frame.seen.map(name=&gt;samples[name].name);
      vision=&#x27;Frame &#x27;+frame.number+&#x27; · &#x27;+(names.length?&#x27;Detected &#x27;+names.join(&#x27;, &#x27;)+&#x27;.&#x27;:&#x27;No object detected.&#x27;);
      if (frame.target) {
        const name=samples[frame.target].name;
        const actions={
          Approach:&#x27;Approach the &#x27;+name+&#x27; with the gripper open.&#x27;,
          Grip:&#x27;Close the gripper around the &#x27;+name+&#x27;.&#x27;,

  function render() {

      ? placementNotice || &#x27;Choose a free spot, or use the arrow keys on Place object.&#x27;

  mission=planMission();
  resize();
  restore(window.openai?.widgetState);
  render();
})();
