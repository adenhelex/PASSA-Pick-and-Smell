# PASSA pick-and-smell prototype. Defaults run entirely on this computer:
# mock camera, mock Arduino, mock E-nose, dry-run motion.

server:
  host: 127.0.0.1
  port: 8000

# Multipliers on how far a camera target moves the arm from the middle of the photo.
# 1 is the normal aim. Higher makes far/near, left/right, and up/down travel farther.
aim:
  offset_x: 1
  offset_y: 1
  offset_z: 1

execution:
  # dry_run validates and simulates motion. armed sends UART through the motion controller.
  mode: dry_run
  motion_timeout_s: 8
  sim_joint_s: 0.2
  # How often a dry-run move publishes the commanded pose while a joint is traveling.
  pose_hz: 30
  lift_segments: 3
  # Seconds the cover stays still over the object after the rim reaches the covering pose.
  sample_hold_s: 10
  enose_step_s: 0.35

serial:
  mode: mock # mock | hardware
  port: ""
  baud: 115200
  ready_token: "READY Braccio UART"
  ready_timeout_s: 6
  stop_timeout_s: 1.5

camera:
  mode: mock # mock | hardware
  index: 0
  width: 640
  height: 480
  stale_after_s: 2.0

llm:
  # Ollama chat API. The dashboard can point this at another computer's IP.
  enabled: true
  api: ollama
  base_url: "http://127.0.0.1:11434"
  model: "llama3.2:latest"
  timeout_s: 12

vlm:
  # When this is on, YOLO finds each object and this model describes it.
  # The camera panel can switch it off for detector names only.
  enabled: true
  api: ollama
  base_url: "http://127.0.0.1:11434"
  model: "qwen3-vl:8b-instruct"
  timeout_s: 25

enose:
  # mock labels every reading. unavailable reports that sampling could not be performed.
  # hardware calls {base_url}/baseline, /sample, and /purge.
  mode: mock # mock | hardware | unavailable
  base_url: "http://127.0.0.1:8090"
  timeout_s: 4

database:
  # PostgreSQL. DATABASE_URL overrides this.
  url: "postgresql://127.0.0.1:5432/passa"

# Validated tabletop, millimetres, origin at the base, +X forward when the base servo reads 90°.
workspace:
  x_min: 100
  x_max: 260
  y_min: -140
  y_max: 140
  zone_radius_mm: 40
  # Shoulder must sit in this band before the base is allowed to rotate.
  transit_shoulder: 75
  clearance_shoulder_min: 40
  clearance_shoulder_max: 115
  # Starter collision rule: a low elbow combined with a dropped shoulder is rejected.
  forbidden_elbow_below: 35
  forbidden_shoulder_above: 140

joints:
  base: {min: 0, max: 180}
  shoulder: {min: 15, max: 165}
  elbow: {min: 0, max: 180}
  wrist_vertical: {min: 0, max: 180}
  wrist_rotation: {min: 0, max: 180}
  gripper: {min: 10, max: 73, open: 10, closed: 73}

# Cylinder sampling cover. The jaw close_angle values below stay so older configs
# still load. Cylinder mode does not command them.
# Park 73° and sample 10° are dry-run assumptions, not a measured horn calibration:
# 10° is design tilt 0° (mouth down) and 73° is design tilt -63°.
tool:
  name: Cylinder sampling cover
  inside_diameter_mm: 110
  clear_height_mm: 100
  body_outside_diameter_mm: 112.4
  flange_outside_diameter_mm: 118
  wall_thickness_mm: 1.2
  roof_thickness_mm: 1.6
  sample_bore_mm: 6.2
  vent_diameter_mm: 1.8
  pivot_x_mm: -6
  pivot_y_mm: 40.5
  pivot_z_mm: 47
  tilt_axis: y
  park_servo_deg: 73
  sample_servo_deg: 10
  design_tilt_at_park_deg: -63
  design_tilt_at_sample_deg: -38
  angles_calibrated: false
  approach_clearance_mm: 40
  seal_standoff_mm: 0
  assumed_object_diameter_mm: 100
  assumed_object_height_mm: 80
  placement_uncertainty_mm: 5
  dimensions_measured: false
  descent_tolerance_px: 48
  # The rim stops at a taught covering pose. This height is unused until it is measured.
  surface_calibrated: false
  surface_z_mm: 0
  mouth_base_deg: 0
  mouth_shoulder_deg: 0
  mouth_elbow_deg: 0
  mouth_wrist_vertical_deg: 0
  mouth_wrist_rotation_deg: 0

# Taught poses. Gripper angle is filled in by the sequencer (open, calibrated close, or hold).
# Replace these with poses you jog to on the real arm, then run a dry-run before arming.
poses:
  # Braccio.Begin() safety rest: lean forward, elbow folded, gripper hanging down.
  park:
    base: 90
    shoulder: 45
    elbow: 180
    wrist_vertical: 180
    wrist_rotation: 90
  # Same fold as park. Opening the elbow points the twin at the sky, so smell is read in place.
  sample:
    base: 90
    shoulder: 50
    elbow: 180
    wrist_vertical: 165
    wrist_rotation: 90
  scan:
    - name: left
      base: 125
      shoulder: 70
      elbow: 105
      wrist_vertical: 80
      wrist_rotation: 90
    - name: center
      base: 90
      shoulder: 65
      elbow: 110
      wrist_vertical: 75
      wrist_rotation: 90
    - name: right
      base: 55
      shoulder: 70
      elbow: 105
      wrist_vertical: 80
      wrist_rotation: 90

zones:
  left:
    x: 170
    y: 110
    reachable: true
    approach: {base: 125, shoulder: 130, elbow: 138, wrist_vertical: 40, wrist_rotation: 90}
    grasp: {base: 125, shoulder: 110, elbow: 82, wrist_vertical: 70, wrist_rotation: 90}
    # Cup already mouth-down. The rim drops straight down to this pose. Reteach it; do not drive the rim into the table.
    cover: {base: 125, shoulder: 164, elbow: 144, wrist_vertical: 0, wrist_rotation: 90}
    lift: {base: 125, shoulder: 70, elbow: 108, wrist_vertical: 80, wrist_rotation: 90}
  center:
    x: 170
    y: 0
    reachable: true
    approach: {base: 90, shoulder: 130, elbow: 138, wrist_vertical: 40, wrist_rotation: 90}
    grasp: {base: 90, shoulder: 112, elbow: 80, wrist_vertical: 68, wrist_rotation: 90}
    cover: {base: 90, shoulder: 164, elbow: 144, wrist_vertical: 0, wrist_rotation: 90}
    lift: {base: 90, shoulder: 68, elbow: 108, wrist_vertical: 78, wrist_rotation: 90}
  right:
    x: 170
    y: -110
    reachable: true
    approach: {base: 55, shoulder: 130, elbow: 138, wrist_vertical: 40, wrist_rotation: 90}
    grasp: {base: 55, shoulder: 110, elbow: 82, wrist_vertical: 70, wrist_rotation: 90}
    cover: {base: 55, shoulder: 164, elbow: 144, wrist_vertical: 0, wrist_rotation: 90}
    lift: {base: 55, shoulder: 70, elbow: 108, wrist_vertical: 80, wrist_rotation: 90}
  front:
    x: 245
    y: 0
    reachable: true
    approach: {base: 90, shoulder: 130, elbow: 138, wrist_vertical: 40, wrist_rotation: 90}
    grasp: {base: 90, shoulder: 108, elbow: 90, wrist_vertical: 72, wrist_rotation: 90}
    cover: {base: 90, shoulder: 164, elbow: 144, wrist_vertical: 0, wrist_rotation: 90}
    lift: {base: 90, shoulder: 64, elbow: 114, wrist_vertical: 76, wrist_rotation: 90}
  far:
    x: 340
    y: 0
    reachable: false
    approach: {base: 90, shoulder: 130, elbow: 138, wrist_vertical: 40, wrist_rotation: 90}
    grasp: {base: 90, shoulder: 112, elbow: 80, wrist_vertical: 68, wrist_rotation: 90}
    cover: {base: 90, shoulder: 164, elbow: 144, wrist_vertical: 0, wrist_rotation: 90}
    lift: {base: 90, shoulder: 68, elbow: 108, wrist_vertical: 78, wrist_rotation: 90}

# Mock scene. close_angle is the old jaw angle. It stays readable and is not used by the cover.
objects:
  orange_fruit:
    label: orange
    kind: fruit
    color: orange
    close_angle: 42
    zone: front
    localizable: true
  orange_cup:
    label: cup
    kind: cup
    color: orange
    close_angle: 60
    zone: right
    localizable: true
  blue_cup:
    label: cup
    kind: cup
    color: blue
    close_angle: 58
    zone: center
    localizable: true
  green_block:
    label: block
    kind: block
    color: green
    close_angle: 48
    zone: far
    localizable: true
  red_block:
    label: block
    kind: block
    color: red
    close_angle: 48
    zone: null
    localizable: false
    image: {u: 90, v: 70, w: 48, h: 40}

# Starter camera model. Leave complete: false until you measure the real wrist camera.
# While this is false, an image pixel is never converted into a servo command.
calibration:
  complete: false
  image_width: 640
  image_height: 480
  intrinsics: {fx: 820, fy: 820, cx: 320, cy: 240}
  # Camera mount relative to the wrist, millimetres and degrees. Pitch is downward.
  camera_in_wrist: {x: 0, y: 35, z: 20, roll: 0, pitch: 55, yaw: 0}
  table_z_mm: 0
  max_range_mm: 800
  links: {base_height: 70, shoulder: 125, elbow: 125, wrist: 60}
